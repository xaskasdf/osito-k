<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsitoK — WebAssembly Shell</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0D0D0D;
            color: #00FF88;
            font-family: 'Courier New', 'VT323', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #161b22;
            border-bottom: 1px solid #FF6B2C;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toolbar h1 {
            font-size: 14px;
            color: #FF6B2C;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .toolbar .badge {
            font-size: 11px;
            color: #00FF88;
            border: 1px solid #00FF88;
            padding: 2px 8px;
        }

        #terminal {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.5;
            color: #00FF88;
            background: #0D0D0D;
        }

        .input-row {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid #222;
            background: #111;
        }

        #prompt-label {
            color: #FF6B2C;
            font-size: 13px;
            margin-right: 8px;
            white-space: nowrap;
        }

        #input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00FF88;
            font-family: inherit;
            font-size: 13px;
            caret-color: #FFD93D;
        }

        .status-bar {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 4px 16px;
            font-size: 11px;
            color: #888;
            display: flex;
            gap: 16px;
        }

        .status-bar .ok { color: #00FF88; }
        .status-bar .warn { color: #FFD93D; }
    </style>
</head>
<body>

<div class="toolbar">
    <h1>[>_] OsitoK / WebAssembly</h1>
    <span class="badge">WASM</span>
</div>

<div id="terminal">Loading kernel...</div>

<div class="input-row">
    <span id="prompt-label">></span>
    <input id="input-field" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="waiting for kernel..." disabled>
</div>

<div class="status-bar">
    <span id="status-arch">arch: wasm32</span>
    <span id="status-mem">mem: --</span>
    <span id="status-fs">fs: --</span>
</div>

<script>
    // ── Terminal output ──────────────────────────────────────────

    const terminal = document.getElementById('terminal');
    const inputField = document.getElementById('input-field');

    terminal.textContent = '';

    // UTF-8 accumulator: buffer bytes until a complete code point is ready.
    var _utf8_buf = [];

    function wasm_putchar(c) {
        c = c & 0xFF;         // C char may be signed; normalize to 0-255
        if (c === 13) return; // \r

        _utf8_buf.push(c);

        // Determine expected sequence length from the first byte.
        var b0 = _utf8_buf[0];
        var expected;
        if      (b0 < 0x80)              expected = 1;
        else if ((b0 & 0xE0) === 0xC0)  expected = 2;
        else if ((b0 & 0xF0) === 0xE0)  expected = 3;
        else if ((b0 & 0xF8) === 0xF0)  expected = 4;
        else { _utf8_buf = []; return; } // invalid lead byte

        if (_utf8_buf.length < expected) return; // need more bytes

        // Decode the complete sequence.
        var bytes = _utf8_buf.splice(0, expected);
        var cp;
        if (expected === 1) {
            cp = bytes[0];
        } else if (expected === 2) {
            cp = ((bytes[0] & 0x1F) << 6)  | (bytes[1] & 0x3F);
        } else if (expected === 3) {
            cp = ((bytes[0] & 0x0F) << 12) | ((bytes[1] & 0x3F) << 6) | (bytes[2] & 0x3F);
        } else {
            cp = ((bytes[0] & 0x07) << 18) | ((bytes[1] & 0x3F) << 12) |
                 ((bytes[2] & 0x3F) << 6)  | (bytes[3] & 0x3F);
        }

        if (cp === 10) {
            terminal.textContent += '\n';
        } else {
            try { terminal.textContent += String.fromCodePoint(cp); }
            catch(e) { terminal.textContent += '?'; }
        }
        terminal.scrollTop = terminal.scrollHeight;
    }

    function wasm_clear_terminal() {
        terminal.textContent = '';
        _utf8_buf = [];
    }

    // ── Keyboard input → C ring buffer ──────────────────────────

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const line = inputField.value;
            inputField.value = '';
            // Push each character + newline into C ring buffer
            for (let i = 0; i < line.length; i++) {
                Module.ccall('wasm_kb_push', null, ['number'], [line.charCodeAt(i)]);
            }
            Module.ccall('wasm_kb_push', null, ['number'], [13]); // '\r' → enter
            e.preventDefault();
        } else if (e.key === 'Backspace') {
            Module.ccall('wasm_kb_push', null, ['number'], [8]); // '\b'
        } else if (e.ctrlKey && e.key === 'c') {
            Module.ccall('wasm_kb_push', null, ['number'], [3]); // Ctrl+C
            e.preventDefault();
        }
    });

    // Enable input field once WASM is running
    function wasm_enable_input() {
        inputField.disabled = false;
        inputField.placeholder = 'type a command...';
        inputField.focus();
        document.getElementById('prompt-label').textContent = '$';

        // Update status bar
        try {
            const usedKb = Module.ccall('wasm_get_mem_used_kb', 'number', [], []);
            document.getElementById('status-mem').textContent =
                'mem: ' + (usedKb > 1024 ? (usedKb / 1024).toFixed(1) + ' MB' : usedKb + ' KB') + ' used';
        } catch(e) {}
        document.getElementById('status-fs').textContent = 'fs: stub';
    }

    // ── Model pre-fetch ─────────────────────────────────────────
    // Start fetching the GGUF model immediately (parallel with WASM init).
    // C side polls window.__modelFetchDone via emscripten_sleep.

    window.__modelBuf      = null;   // Uint8Array once downloaded
    window.__modelFetchDone = false; // true when fetch completes (success or fail)

    // Optional override via ?model=URL or ?fs=URL query params (for testing).
    var qs = new URLSearchParams(window.location.search);
    var modelOverride = qs.get('model');
    var fsOverride    = qs.get('fs');

    (function() {
        var MODEL_URL = modelOverride
            || 'https://wasm.naranjositos.tech/models/smollm2-135m-instruct-q4_0.gguf';
        fetch(MODEL_URL)
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.arrayBuffer();
            })
            .then(function(ab) {
                window.__modelBuf = new Uint8Array(ab);
                console.log('[WASM] model downloaded: ' + ab.byteLength + ' bytes');
                window.__modelFetchDone = true;
            })
            .catch(function(e) {
                console.error('[WASM] model fetch failed:', e);
                window.__modelFetchDone = true;
            });
    })();

    // ── Filesystem image pre-fetch ────────────────────────────────
    // OsitoFS .img with game data (Q2 PAK files etc.)

    window.__fsImageBuf  = null;
    window.__fsImageDone = false;

    (function() {
        var FS_URL = fsOverride
            || 'https://wasm.naranjositos.tech/images/q2_wasm.img';
        fetch(FS_URL)
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.arrayBuffer();
            })
            .then(function(ab) {
                window.__fsImageBuf = new Uint8Array(ab);
                console.log('[WASM] FS image downloaded: ' + ab.byteLength + ' bytes');
                window.__fsImageDone = true;
            })
            .catch(function(e) {
                console.warn('[WASM] FS image fetch failed (standalone mode):', e.message);
                window.__fsImageDone = true;
            });
    })();

    // ── In-browser C/C++ compiler (clang.wasm + lld.wasm) ────────
    //
    // Lazy-loads a worker that runs binji/wasm-clang against the toolchain
    // hosted at wasm.naranjositos.tech/toolchain/. First call to compile()
    // pays ~50MB download (cached by browser); subsequent calls are fast.

    window.__cc = (function() {
        let worker = null;
        let port = null;
        let ready = null;
        let pendingWrite = '';
        let resolveCompile = null;

        const WORKER_SRC = `
            /* IndexedDB cache for clang/lld/sysroot/memfs.
             * First visit: fetch from R2 + persist (~50 MB).
             * Later visits: instant load from IDB. */
            const DB_NAME = 'osito-cc-v1', STORE = 'toolchain';
            function idbOpen() {
              return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
            }
            async function idbGet(key) {
              try {
                const db = await idbOpen();
                return await new Promise((resolve) => {
                  const tx = db.transaction(STORE);
                  const r = tx.objectStore(STORE).get(key);
                  r.onsuccess = () => resolve(r.result || null);
                  r.onerror = () => resolve(null);
                });
              } catch { return null; }
            }
            async function idbPut(key, ab) {
              try {
                const db = await idbOpen();
                await new Promise((resolve) => {
                  const tx = db.transaction(STORE, 'readwrite');
                  tx.objectStore(STORE).put(ab, key);
                  tx.oncomplete = resolve;
                  tx.onerror = resolve;
                  tx.onabort = resolve;
                });
              } catch {}
            }
            async function fetchCached(url, label) {
              let ab = await idbGet(url);
              if (ab) {
                port && port.postMessage({ id: 'write', data: '\\x1b[2m[cache] ' + (label||url) + ' (' + (ab.byteLength/1024/1024).toFixed(1) + ' MB)\\x1b[0m\\n' });
                return ab;
              }
              const r = await fetch(url);
              if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + url);
              ab = await r.arrayBuffer();
              await idbPut(url, ab);
              return ab;
            }

            self.importScripts('https://wasm.naranjositos.tech/toolchain/shared.js');
            const T = 'https://wasm.naranjositos.tech/toolchain';
            let api, port;
            let ositokH = null;  /* lazy-loaded ositok.h text */

            const opts = {
                clang: T + '/clang.wasm', lld: T + '/lld.wasm',
                sysroot: T + '/sysroot.tar', memfs: T + '/memfs.wasm',
                async readBuffer(f) { return await fetchCached(f, f.split('/').pop()); },
                async compileStreaming(f) { return WebAssembly.compile(await fetchCached(f, f.split('/').pop())); },
                hostWrite(s) { port && port.postMessage({ id: 'write', data: s }); }
            };
            self.onmessage = async (e) => {
                if (e.data.id === 'constructor') {
                    port = e.data.data;
                    port.onmessage = self.onmessage;
                    api = new API(opts);
                    /* Wrap api.ready so it ALSO awaits ositok.h injection
                     * into MemFS at /include/ositok.h. Compile handlers
                     * await api.ready, so this guarantees the header is
                     * in place before clang runs. */
                    const baseReady = api.ready;
                    api.ready = (async function() {
                        await baseReady;
                        try {
                            if (!ositokH) ositokH = await (await fetch(T + '/ositok.h')).text();
                            /* Tar paths in sysroot have no leading slash —
                             * match that convention so AddFileNode resolves
                             * the parent dir correctly. */
                            api.memfs.addFile('include/ositok.h', ositokH);
                        } catch (e) {
                            port.postMessage({ id: 'write', data: '\\n[cc] ositok.h fetch failed: ' + e.message + '\\n' });
                        }
                    })();
                    port.postMessage({ id: 'ready' });
                } else if (e.data.id === 'compileLinkRun') {
                    try { await api.compileLinkRun(e.data.data, { lang: e.data.lang || 'c++' }); }
                    catch (err) { port.postMessage({ id: 'write', data: '\\n[cc] ' + err.message + '\\n' }); }
                    port.postMessage({ id: 'done' });
                } else if (e.data.id === 'preprocess') {
                    try {
                        const lang = e.data.lang || 'c++';
                        const input = lang === 'c' ? 't.c' : 't.cc';
                        await api.ready;
                        await api.preprocess({ input, contents: e.data.data, lang });
                    } catch (err) {
                        port.postMessage({ id: 'write', data: '\\n[cc -E] ' + err.message + '\\n' });
                    }
                    port.postMessage({ id: 'done' });
                } else if (e.data.id === 'compile') {
                    /* compile + link, return bytes (no run) */
                    try {
                        const lang = e.data.lang || 'c++';
                        const ext = lang === 'c' ? 'c' : 'cc';
                        const input = 't.' + ext, obj = 't.o', wasm = 't.wasm';
                        await api.ready;
                        await api.compile({ input, contents: e.data.data, obj, lang });
                        if (e.data.objectOnly) {
                            /* cc -c: stop after producing the .o */
                            const view = api.memfs.getFileContents(obj);
                            const ab = view.slice().buffer;
                            port.postMessage({ id: 'compiled', wasm: ab }, [ab]);
                        } else {
                            await api.link(obj, wasm);
                            const view = api.memfs.getFileContents(wasm);
                            const ab = view.slice().buffer;
                            port.postMessage({ id: 'compiled', wasm: ab }, [ab]);
                        }
                    } catch (err) {
                        port.postMessage({ id: 'compiled', error: err.message });
                    }
                } else if (e.data.id === 'runWasi') {
                    /* Instantiate raw wasm bytes and run via API.run (uses
                     * the App class internally — App is closure-private). */
                    try {
                        await api.ready;
                        const mod = await WebAssembly.compile(e.data.bytes);
                        await api.run(mod, e.data.name || 'app');
                    } catch (err) {
                        if (err && err.code !== undefined) {
                            port.postMessage({ id: 'write', data: '\\n[exit ' + err.code + ']\\n' });
                        } else {
                            port.postMessage({ id: 'write', data: '\\n[wasi] ' + (err.message || err) + '\\n' });
                        }
                    }
                    port.postMessage({ id: 'done' });
                }
            };`;

        let resolveCompiled = null;

        function ensureWorker() {
            if (worker) return ready;
            const blob = new Blob([WORKER_SRC], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));
            const ch = new MessageChannel();
            port = ch.port1;
            ready = new Promise((resolve) => {
                port.onmessage = (e) => {
                    if (e.data.id === 'ready') resolve();
                    else if (e.data.id === 'write') {
                        pendingWrite += e.data.data;
                        if (window.__cc.onWrite) window.__cc.onWrite(e.data.data);
                    }
                    else if (e.data.id === 'done' && resolveCompile) {
                        const cb = resolveCompile;
                        resolveCompile = null;
                        cb(pendingWrite);
                        pendingWrite = '';
                    }
                    else if (e.data.id === 'compiled' && resolveCompiled) {
                        const cb = resolveCompiled;
                        resolveCompiled = null;
                        if (e.data.error) cb({ error: e.data.error });
                        else              cb({ wasm: e.data.wasm });
                    }
                };
            });
            worker.postMessage({ id: 'constructor', data: ch.port2 }, [ch.port2]);
            return ready;
        }

        return {
            onWrite: null,
            // Compile + link + run inline. src: string, lang: 'c' | 'c++'
            compileLinkRun: async function(src, lang) {
                await ensureWorker();
                pendingWrite = '';
                return new Promise((resolve) => {
                    resolveCompile = resolve;
                    port.postMessage({ id: 'compileLinkRun', data: src, lang: lang || 'c++' });
                });
            },
            // Compile + link → Promise<{wasm: ArrayBuffer} | {error: string}>
            // If objectOnly=true, returns the .o bytes (no link step).
            compile: async function(src, lang, objectOnly) {
                await ensureWorker();
                return new Promise((resolve) => {
                    resolveCompiled = resolve;
                    port.postMessage({ id: 'compile', data: src, lang: lang || 'c++', objectOnly: !!objectOnly });
                });
            },
            // Preprocess only (clang -cc1 -E). Output streams via onWrite.
            preprocess: async function(src, lang) {
                await ensureWorker();
                pendingWrite = '';
                return new Promise((resolve) => {
                    resolveCompile = resolve;
                    port.postMessage({ id: 'preprocess', data: src, lang: lang || 'c++' });
                });
            },
            // Run a pre-compiled wasm module via WASI shim. bytes: ArrayBuffer
            runWasi: async function(bytes, name) {
                await ensureWorker();
                pendingWrite = '';
                return new Promise((resolve) => {
                    resolveCompile = resolve;
                    /* Note: bytes will be transferred (consumed) */
                    const transfer = bytes instanceof ArrayBuffer ? [bytes] : [];
                    port.postMessage({ id: 'runWasi', bytes, name: name || 'app' }, transfer);
                });
            }
        };
    })();

    // ── Emscripten module config ─────────────────────────────────

    var Module = {
        print: function(text) {
            for (let i = 0; i < text.length; i++) wasm_putchar(text.charCodeAt(i));
            wasm_putchar(10); // newline
        },
        printErr: function(text) {
            terminal.textContent += '[ERR] ' + text + '\n';
        },
        onRuntimeInitialized: function() {
            // Input is enabled here so the user can type during model load.
            // main() runs next and polls __modelFetchDone before shell_run().
            wasm_enable_input();
        },
        noInitialRun: false,
    };
</script>

<!-- Emscripten-generated JS bundle (injected by emcc) -->

</body>
</html>
